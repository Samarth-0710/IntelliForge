services:
  # IntelliForge 2.0 Backend Service (FastAPI)
  - type: web
    name: intelliforge-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: "IntelliForge SOC Platform"
      - key: APP_VERSION
        value: "2.0.0"
      - key: DATABASE_URL
        fromDatabase:
          name: intelliforge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: LYZR_API_KEY
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://intelliforge-frontend.onrender.com"

  # IntelliForge 2.0 Frontend Service (Next.js)
  - type: web
    name: intelliforge-frontend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: intelliforge-backend
          property: host

databases:
  # PostgreSQL Database for IntelliForge SOC
  - name: intelliforge-db
    databaseName: intelliforge
    user: intelliforge_user
    plan: free
